
version: 2

models:
  - name: int_machine_observations
    description: >
      Enriched machine observations with temperature deltas,
      failure flags, and a reporting category.

    columns:
      - name: source_record_id
        data_tests:
          - not_null
          - unique

      - name: temperature_delta_k
        data_tests:
          - not_null

      - name: failure_mode_count
        data_tests:
          - not_null

      - name: is_machine_failure
        data_tests:
          - not_null

      - name: primary_failure_category
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - tool_wear
                  - heat_dissipation
                  - power
                  - overstrain
                  - random
                  - other_or_unclassified
                  - no_recorded_failure
